events {
    worker_connections 1024;
}

http {
    # Load balancer: round-robin (default) across two identical backends.
    # If one backend is down, nginx retries the request on the other one.
    upstream resilience_backend_pool {
        server backend-1:8000;
        server backend-2:8000;
    }

    server {
        listen 8080;
        server_name _;

        # Tells the client which backend container answered (useful for the demo).
        add_header X-Upstream-Addr $upstream_addr always;

        location /health {
            proxy_pass http://resilience_backend_pool/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass http://resilience_backend_pool/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
