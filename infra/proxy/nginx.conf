events {
    worker_connections 1024;
}

http {
    upstream resilience_backend_pool {
        least_conn;
        server resilience-backend:8000;
    }

    server {
        listen 8080;
        server_name _;

        location /health {
            proxy_pass http://resilience_backend_pool/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass http://resilience_backend_pool/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
