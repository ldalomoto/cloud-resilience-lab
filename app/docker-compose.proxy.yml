# Reverse proxy + load balancer demo: nginx in front of two identical backends.
# Run with: docker compose -f docker-compose.proxy.yml up --build -d
services:
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-1
    environment:
      INSTANCE_ID: backend-1

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-2
    environment:
      INSTANCE_ID: backend-2

  proxy:
    image: nginx:1.27-alpine
    container_name: resilience-proxy
    volumes:
      - ../infra/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - backend-1
      - backend-2
